<text x="540.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">The Arduino is not given a volume command directly; the host closes the calibrated dose step by integrating commanded actuator travel and issuing V0.</text>
