<text x="470.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="400">block during calibration</text>
<text x="470.0" y="179.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="400">branch: manual vs injection</text>
<rect x="670" y="88" width="170" height="118" rx="5" fill="#f8fafc" stroke="#f2a900" stroke-width="2"/>
<text x="682.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f2a900" text-anchor="start" font-weight="700">Command synthesis</text>
<text x="682.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="400">manual: LT -&gt; +V</text>
<text x="682.0" y="149.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="400">manual: RT -&gt; -V</text>
<text x="682.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="400">injection: RT drives dose</text>
<text x="682.0" y="179.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="400">release/complete -&gt; V0</text>
