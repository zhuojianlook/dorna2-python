<text x="28.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1f2933" text-anchor="start" font-weight="700">Figure 20. Xbox-to-Arduino syringe control stack</text>
<text x="28.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52616b" text-anchor="start" font-weight="400">Controller triggers are converted into guarded serial velocity commands and calibrated volume accounting.</text>
