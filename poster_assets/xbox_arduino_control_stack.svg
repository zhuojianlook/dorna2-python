<rect x="530" y="252" width="500" height="255" rx="5" fill="#ffffff" stroke="#d9e2ec"/>
<text x="548.0" y="282.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700">Calibrated dose integrator</text>
<text x="548.0" y="310.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">s_step = s_full * Q_step / Q_full = 2208.1 units</text>
<text x="548.0" y="332.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">s_k = s_(k-1) + |V_cmd| * dt</text>
<text x="548.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">stop when s_k &gt;= s_step, then write V0</text>
<text x="548.0" y="376.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">current step = 1 uL, nominal time = 1.380 s</text>
<text x="558.0" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#52616b" text-anchor="start" font-weight="700">full calibrated syringe stroke</text>
